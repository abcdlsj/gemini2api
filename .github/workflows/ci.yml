name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra dev
      - run: uv run --extra dev ruff check gemini2api integrations packaging tests
      - run: uv run --extra dev pytest -q

  # `integrations/kip/cookies.ts` is copied into Kip; these tests are the contract.
  ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun test integrations/kip
