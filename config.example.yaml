# Copy to config.yaml and `chmod 600 config.yaml`.
#
# Cookies: open gemini.google.com in a private window (Firefox preferred — Chromium's Device
# Bound Session Credentials make copied cookies die within hours), then
# DevTools → Application → Cookies → copy __Secure-1PSID and __Secure-1PSIDTS.

accounts:
  - id: "ultra"
    secure_1psid: "PASTE___Secure-1PSID___HERE"
    secure_1psidts: "PASTE___Secure-1PSIDTS___HERE"
    proxy: "http://127.0.0.1:7890"   # gemini.google.com is unreachable without it here
    # impersonate: "chrome"            # curl_cffi browser fingerprint
    # Every other Google cookie the browser holds. `python -m gemini2api.cookies --write`
    # fills this in; two PSID cookies alone are not enough any more.
    # cookies:
    #   SID: "..."
    #   SAPISID: "..."

# Leave empty to disable auth (only safe on loopback). Clients can mint their own keys with
# `POST /v1/keys`; those live in state_dir/keys.json and are accepted alongside this one.
api_key: ""

host: "127.0.0.1"
port: 8790

# normal | temporary | auto_delete
#   auto_delete keeps context reliable and still cleans up the Google account afterwards.
chat_mode: "auto_delete"
auto_delete_ttl: 86400

# on_change | always
#   on_change sends a short tool reminder (~200 chars) on reused chats when the tool set has not
#   changed — a bet that the model remembers parameter names from earlier turns. A miss fails
#   visibly in argument validation; set "always" to disable the bet and resend full schemas.
tools_repeat: "on_change"

default_thinking: false
max_prompt_chars: 900000
timeout: 450
refresh_interval: 600
# Where the library caches the cookies it rotates. A temp directory leaves a stale copy behind
# that shadows the configured cookies and turns a valid session into a guest session.
state_dir: ".gemini2api-state"
